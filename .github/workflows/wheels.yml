# Prebuilt wheels: CPython 3.12 and 3.13 on Windows x64 and Linux x86_64
# (manylinux), each tested with the full pytest suite before it is kept.
# A version tag (v*) attaches them to a GitHub Release; PyPI upload runs once
# the repository variable PYPI_PUBLISH is "true" (PyPI trusted publishing for
# this repository and the environment "pypi" set up first).
name: wheels
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/wheels.yml
      - pyproject.toml
      - CMakeLists.txt
  workflow_dispatch:

jobs:
  # A release tag must name the version that CMakeLists.txt sets (project()),
  # which the wheels, the sdist and numpy2x.__version__ all take.
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the version in CMakeLists.txt
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(sed -nE 's/^project\(numpy2x VERSION ([^ ]+).*/\1/p' CMakeLists.txt)
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $v in CMakeLists.txt"
            exit 1
          fi

  wheels:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build and test wheels
        run: |
          python -m pip install cibuildwheel==4.3.5
          python -m cibuildwheel --output-dir wheelhouse
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pipx run build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  pypi:
    if: startsWith(github.ref, 'refs/tags/v') && vars.PYPI_PUBLISH == 'true'
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
